name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 重命名脚本
        id: pkg
        run: |
          name="batch_handbrake-${GITHUB_REF_NAME#v}.py"
          cp batch_handbrake.py "$name"
          echo "asset=$name" >> "$GITHUB_OUTPUT"

      - name: 创建 Release 并上传
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.pkg.outputs.asset }}